<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="grid"></div>
    <div class="players_container"></div>
    <dialog class="new_game_dialog">
      <form method="dialog" class="new_game_form">
        <h2 class="title_form">Новая игра</h2>
        <div class="form_group">
          <label class="label_name" for="first_player">Игрок 1:</label>
          <input type="text" name="first_player_name" id="first_player" />
        </div>
        <div class="form_group">
          <label class="label_name" for="second_player">Игрок 2:</label>
          <input type="text" name="second_player_name" id="second_player" />
        </div>
        <div class="start_actions">
          <button type="submit" id="start_btn" class="start_btn">Начать</button>
        </div>
      </form>
    </dialog>
    <dialog class="restart_game_dialog">
      <h2 class="restart_title">Игра Окончена</h2>
      <p class="who_win"></p>
      <div class="restart_actions">
        <button class="restart_new_btn">Новая игра</button>
        <button class="restart_btn">Заново</button>
      </div>
    </dialog>
  </body>
</html>
